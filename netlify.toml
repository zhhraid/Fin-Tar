# Deploy ke Netlify. Nitro mengenali Netlify saat build dan menaruh berkas statis di
# "dist" serta server (halaman awal, Finix, pemindai struk) sebagai fungsi serverless.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Static files are served by Netlify's CDN without passing through the server, so the
# basic headers are repeated here. Pages get the full set, including the
# Content-Security-Policy, from src/lib/security-headers.ts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
